name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать production frontend
        env:
          VUE_APP_SERVER: https://example.invalid
          VUE_APP_SITE_KEY: logos
        run: npm run build
